[metadata]
name = stactools-sentinel3
version = attr: stactools.sentinel3.__version__
description = Stactools package for Sentinel-3 OLCI (level 1 EFR, ERR and level 2 LFR, LRR, WFR), SLSTR (level 1 RBT and level 2 FRP, LST, WST), SRAL (level 2 LAN, WAT), and SYNERGY (level 2 AOD, SYN, V10, VG1, VGP) scenes.
long_description = file: README.md
long_description_content_type = text/markdown
author = Chung-Xiang Hong & William Ray
author_email = chung.horng@sinergise.com, william.ray@sinergise.com
url = https://github.com/chorng/sentinel3
project_urls =
    Issues = https://github.com/chorng/sentinel3/issues
keywords =
    stactools
    pystac
    catalog
    STAC
    sentinel
    OLCI
    EFR
    ERR
    LFR
    LRR
    WFR
    SLSTR
    RBT
    FRP
    LWT
    WST
    SRAL
    LAN
    WAT
    SYNERGY
    AOD
    SYN
    V10
    VG1
    VGP
classifiers =
    Development Status :: 4 - Beta
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11

[options]
package_dir =
    = src
packages = find_namespace:

#by stactools
    # "antimeridian>=0.2.6",
    # "click>=8.1.3",
    # "fsspec[http]>=2021.7",
    # "lxml>=4.9.2",
    # "numpy>=1.23.0",
    # "pyproj>=3.3",
    # "rasterio>=1.3.2",
    # "shapely>=2.0.1",
    #    "pystac[validation]>=1.8.2",
install_requires =
    stactools >= 0.4
    pystac @ git+https://github.com/Terradue/pystac@t2_extensions
    netCDF4 >= 1.6.3
    antimeridian >= 0.2.6

[options.packages.find]
where = src